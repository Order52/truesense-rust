[workspace]
resolver = "3"
members = ["crates/truesense", "crates/ts-api",
    "crates/ts-cli", "crates/ts-daemon", "crates/ts-decision", "crates/ts-domain", "crates/ts-foundation", "crates/ts-fx", "crates/ts-gui", "crates/ts-ipc", "crates/ts-keys", "crates/ts-platform", "crates/ts-system", "crates/ts-tui"]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
libc = "0.2"
sha2 = "0.10"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = "0.28"
tiny_http = "0.12"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
dbg_macro = "deny"
todo = "deny"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
strip = true
