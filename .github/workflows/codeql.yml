name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 3 * * 3"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

# Both languages of the repository: the Rust program (analysed from source, no build needed) and the C kernel module (compiled for real so CodeQL sees what ships).
# The small C helper tools/nvml/truesense-nvml.c is compiled in the same C job.
jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { language: rust, build-mode: none }
          - { language: c-cpp, build-mode: manual }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Build the kernel module and the GPU helper for CodeQL (C)
        if: matrix.language == 'c-cpp'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq "linux-headers-$(uname -r)"
          (cd kernel/truesense-wmi && make KVER="$(uname -r)")
          gcc -O2 -Wall -o /tmp/truesense-nvml tools/nvml/truesense-nvml.c -ldl
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with: { category: "/language:${{ matrix.language }}" }
