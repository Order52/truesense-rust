PACKAGE_NAME="truesense-wmi"
PACKAGE_VERSION="0.4.0"
BUILT_MODULE_NAME[0]="truesense_wmi"
DEST_MODULE_LOCATION[0]="/updates/dkms"
AUTOINSTALL="yes"
MAKE[0]="make KVER=${kernelver} all"
# 6.6 LTS and newer only: the WMI driver API used here is stable from 6.6; older kernels are untested
BUILD_EXCLUSIVE_KERNEL="^(6\.([6-9]|[1-9][0-9])\.|[7-9]\.|[1-9][0-9]+\.)"
