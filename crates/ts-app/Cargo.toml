[package]
name = "ts-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "The native TrueSense window (truesense-app): egui over the same command layer as the web window"

[lints]
workspace = true

[[bin]]
name = "truesense-app"
path = "src/main.rs"

[dependencies]
ts-foundation = { path = "../ts-foundation" }
ts-api = { path = "../ts-api" }
ts-gui = { path = "../ts-gui" }
ts-keys = { path = "../ts-keys" }
serde.workspace = true
serde_json.workspace = true
libc.workspace = true
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui_extras = { version = "0.37", default-features = false, features = ["svg"] }
